# YT-0035 — authorization policy gate.
#
# Two things run here, and they are two things on purpose:
#
#   1. `cerbos compile` — the policy repo compiles, and its 300+ test
#      assertions hold. This is the object-level authz suite docs/14 §4 calls
#      a required CI suite rather than a review habit.
#   2. `@yourtal/authz` — the TypeScript side, including the drift test that
#      fails when the TS action registry and the policy YAML disagree.
#
# Splitting them matters because they fail for different reasons and a
# reviewer should be able to tell which at a glance: (1) failing means a rule
# changed meaning, (2) failing usually means someone added an action on one
# side of the seam and not the other.
name: Authorization policies

on:
  # Runnable on demand. A gate whose paths happen to match nothing cannot
  # otherwise be proved to run — go.yml sat unexecuted through six pushes.
  workflow_dispatch:
  pull_request:
    paths:
      - "policies/**"
      - "packages/authz/**"
      - "scripts/policy-test.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/authz.yml"
  push:
    branches: [main]
    paths:
      - "policies/**"
      - "packages/authz/**"
      - ".github/workflows/authz.yml"

concurrency:
  group: authz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policies:
    name: Cerbos policy suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sidecar runs. A policy repo that compiles under one Cerbos version
      # and not another is an incident waiting for an upgrade.
      - name: Compile policies and run the test suites
        run: node scripts/policy-test.mjs

  authz-package:
    name: "@yourtal/authz"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # package.json, so CI and local toolchains cannot drift.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @yourtal/authz typecheck

      - name: Lint
        run: pnpm --filter @yourtal/authz lint

      # Includes policy-drift.test.ts, which reads the YAML in policies/ and
      # asserts it matches the TypeScript registry in both directions.
      - name: Test
        run: pnpm --filter @yourtal/authz test
