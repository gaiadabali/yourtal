# YT-0511 — formatting gate.
#
# Prettier drift had reached 239 files across the repo before this existed,
# which is what happens when several people format only what they touch. The
# fix is not a one-off cleanup — it is this check, so it cannot re-accumulate.
#
# ## This job is RED until someone runs `pnpm format` once, repo-wide
#
# That is deliberate and it is the whole point of the ticket. At the time of
# writing, `apps/web` and `packages/ui` carry ~186 unformatted files. They
# were left alone rather than reformatted, because another session is
# actively editing them and rewriting 186 of someone's files mid-change
# creates a merge conflict for no benefit. Whoever owns those directories
# runs `pnpm format` when it suits them and this goes green.
#
# Everything else — apps/api, packages/{contracts,authz,consent,jurisdiction}
# and policies/ — is already clean.
#
# Generated artifacts are excluded via .prettierignore, not here: the
# OpenAPI document and the generated Go are formatted by their generator, and
# reformatting them would break the YT-0031 drift gates on pure whitespace.
name: Format

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: format-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        # `pnpm format` fixes everything this reports.
        run: pnpm exec prettier --check .
