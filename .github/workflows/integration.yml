# Integration tests — the suites that need a real database.
#
# ## Why this exists separately
#
# Until now NO workflow ran a Postgres-backed test. `packages/db`,
# `packages/idempotency`'s Postgres store and the Go ledger all skip or fail
# without a database, so their most important assertions — the deferred
# balance trigger, one-of-eight concurrent claims winning, an unbalanced
# transfer refused at COMMIT — were green in CI by never running.
#
# A suite that silently skips is worse than one that fails: it reports
# success for work it did not do. So this workflow stands the stack up, and
# `assert nothing skipped` below fails the build if the suites quietly opt out.
#
# YT-0527 added the `cerbos` service alongside `postgres`. Before this,
# `apps/api` had never booted against a real PDP in CI: every authz test —
# `pdp.guard.test.ts`, `packages/authz/src/pdp-client.test.ts` — mocks
# `fetch`, so none of them could see Cerbos's own schema enforcement reject
# a real request. That exact bug shipped once (see
# `policies/_schemas/resource/business.json`'s comment on `businessId`) and
# was found only by a person booting the app by hand. `app.boot.test.ts` is
# the suite that now runs here against the real container.
name: Integration

on:
  pull_request:
    paths:
      - "packages/db/**"
      - "packages/idempotency/**"
      - "services/**"
      - "infra/postgres/**"
      - "infra/cerbos/**"
      - "apps/api/**"
      - "packages/authz/**"
      - "policies/**"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Postgres-backed suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yourtal
          POSTGRES_PASSWORD: yourtal_local_only
          POSTGRES_DB: yourtal
        ports:
          - 26432:5432
        options: >-
          --health-cmd "pg_isready -U yourtal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Object storage for the media suite (YT-0521). A service container is
      # right here, unlike Cerbos above: MinIO mounts nothing from the
      # repository, so starting before `actions/checkout` costs it nothing.
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: yourtal
          MINIO_ROOT_PASSWORD: yourtal_local_only
        ports:
          - 26900:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # The RUNTIME role, unprivileged on purpose (YT-0554, risk 45). CI used
      # this variable for everything, including the app, so CI was exercising
      # a superuser connection and every GRANT/REVOKE in the schema was
      # decorative here too. The API now refuses to boot as a privileged role.
      DATABASE_URL: postgres://yourtal_app:app_local_only@127.0.0.1:26432/yourtal
      # The OWNER role. Bootstrap and migrations only — never the app.
      DATABASE_OWNER_URL: postgres://yourtal:yourtal_local_only@127.0.0.1:26432/yourtal
      # Matches docker-compose.yml's mapped host port and .env.example — see
      # the drift test in apps/api/src/config/env.schema.test.ts.
      PDP_BASE_URL: http://127.0.0.1:26592
      # Matches docker-compose.yml and .env.example (YT-0521).
      S3_ENDPOINT: http://127.0.0.1:26900
      S3_ACCESS_KEY: yourtal
      S3_SECRET_KEY: yourtal_local_only
      S3_BUCKET: yourtal-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # Cerbos runs as a STEP, not a `services:` container.
      #
      # It was a service container, and it could never have worked. GitHub
      # creates service containers BEFORE the job's first step — so before
      # `actions/checkout` — and `${{ github.workspace }}` is empty at that
      # moment. `/policies` mounted an empty directory, and Cerbos logged
      # `Found 0 executable policies`.
      #
      # The previous comment here knew that and argued it was fine, because
      # `storage.disk.watchForChanges: true` would pick the policies up once
      # checkout ran. **That setting lives in `config.yaml`, which failed to
      # mount for the same reason** — the path did not exist, so Docker
      # created a DIRECTORY at `/config/config.yaml`, Cerbos fell back to
      # `Loading configuration from __default__`, and the compensating
      # control was disabled by the fault it was compensating for. The
      # healthcheck then ran `--config=/config/config.yaml` against a
      # directory, the container went unhealthy, and the job died before a
      # single test ran.
      #
      # None of this was visible until 2026-09-20, because the repository
      # had no remote and this workflow had never executed once.
      - name: Start Cerbos (it needs the repo, so it cannot be a service)
        run: |
          docker run -d --name cerbos \
            -p 127.0.0.1:26592:3592 \
            -v "$GITHUB_WORKSPACE/policies:/policies:ro" \
            -v "$GITHUB_WORKSPACE/infra/cerbos/config.yaml:/config/config.yaml:ro" \
            ghcr.io/cerbos/cerbos:0.55.0 server --config=/config/config.yaml

      - name: Wait for Cerbos, and assert it loaded actual policies
        run: |
          for _ in $(seq 1 40); do
            if docker exec cerbos /cerbos healthcheck --config=/config/config.yaml >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec cerbos /cerbos healthcheck --config=/config/config.yaml
          # Health is not the question. A PDP that came up with zero policies
          # is HEALTHY and answers DENY to everything — it looks like a
          # working PDP while refusing every request, which is the exact
          # failure that hid here for as long as the workflow existed.
          if docker logs cerbos 2>&1 | grep -q 'Found 0 executable policies'; then
            echo "::error::Cerbos started with 0 policies — the mount is wrong."
            docker logs cerbos
            exit 1
          fi
          docker logs cerbos 2>&1 | grep -o 'Found [0-9]* executable policies' | tail -1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Go
        uses: actions/setup-go@v5.2.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            services/ledger/go.sum
            services/voucher/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The compose file runs this at container start; the Actions service
      # container does not, so it is applied by hand. It creates the six
      # domain schemas and the two roles, which must exist before any
      # migration grants anything on them.
      - name: Bootstrap schemas and roles
        run: psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-schemas.sql

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: packages/db
        run: pnpm --filter @yourtal/db test

      - name: packages/idempotency
        run: pnpm --filter @yourtal/idempotency test

      # YT-0527. app.boot.test.ts boots the real AppModule and calls it over
      # a real HTTP round trip against the cerbos service above — the first
      # apps/api suite that talks to a live PDP rather than a mocked fetch.
      - name: apps/api (live PDP boot check)
        run: |
          set -o pipefail
          pnpm --filter @yourtal/api test 2>&1 | tee /tmp/api-test.log

      # Same guard as the Go suites below: vitest only mentions "skipped" in
      # its summary when the count is nonzero, so this catches a test that
      # opted out (`it.skip`, `describe.skip`) rather than actually reaching
      # Cerbos — which would otherwise report success for work it never did.
      - name: Assert apps/api reported nothing skipped
        run: |
          if grep -qi "skipped" /tmp/api-test.log; then
            echo "::error::A live-PDP test skipped. It did not run, so its result means nothing."
            grep -i "skipped" /tmp/api-test.log
            exit 1
          fi

      # -p 1 and -count=1 for the same reasons as services/*/package.json:
      # these packages share ONE Postgres and `go test` runs package binaries
      # concurrently, so internal/proof's deliberate tamper window races
      # internal/ledger's clean-ledger assertion (YT-0567). Without -p 1 this
      # job fails intermittently for a reason that has nothing to do with the
      # change being tested — the most expensive kind of red.
      - name: Go ledger
        run: go test -count=1 -p 1 ./...
        working-directory: services/ledger

      # The point of the whole workflow. `go test` prints "no test files" for
      # packages without tests, which is fine — but a SKIP here means a suite
      # could not reach the database and reported success anyway.
      - name: Assert nothing skipped (ledger)
        run: |
          go test -count=1 -p 1 ./... -v 2>&1 | tee /tmp/go-test.log
          if grep -q -- "--- SKIP" /tmp/go-test.log; then
            echo "::error::A Postgres-backed test skipped. It did not run, so its result means nothing."
            grep -- "--- SKIP" /tmp/go-test.log
            exit 1
          fi
        working-directory: services/ledger

      # The voucher service (YT-0140..0155). Almost everything it asserts is
      # a database constraint — one live hold per voucher, a capture that
      # cannot exceed its authorization, refunds bounded at COMMIT, an audit
      # chain that breaks when a row is edited — so without Postgres this
      # suite tests nothing at all and says so by skipping.
      #
      # It needs BOTH credentials: `yourtal_voucher` for the service's own
      # work, and the owner for the tamper tests, which have to damage an
      # event log the service itself is deliberately unable to damage.
      - name: Go voucher
        run: go test -count=1 -p 1 ./...
        working-directory: services/voucher
        env:
          VOUCHER_DATABASE_URL: postgres://yourtal_voucher:voucher_local_only@127.0.0.1:26432/yourtal
          OWNER_DATABASE_URL: ${{ env.DATABASE_OWNER_URL }}

      - name: Assert nothing skipped (voucher)
        run: |
          go test -count=1 -p 1 ./... -v 2>&1 | tee /tmp/go-voucher.log
          if grep -q -- "--- SKIP" /tmp/go-voucher.log; then
            echo "::error::A Postgres-backed test skipped. It did not run, so its result means nothing."
            grep -- "--- SKIP" /tmp/go-voucher.log
            exit 1
          fi
        working-directory: services/voucher
        env:
          VOUCHER_DATABASE_URL: postgres://yourtal_voucher:voucher_local_only@127.0.0.1:26432/yourtal
          OWNER_DATABASE_URL: ${{ env.DATABASE_OWNER_URL }}

      # Everything else, now that Postgres and a live PDP are up. The
      # targeted steps above exist for their SKIP guards and their tee'd
      # logs; this catches every suite that has neither — and it is the
      # same command `pnpm verify` runs locally, so the two cannot drift.
      - name: Every remaining suite
        run: |
          set -o pipefail
          pnpm exec turbo run test --concurrency=1 2>&1 | tee /tmp/sweep.log

      # This step was added without a skip guard, and the media suite
      # promptly reported `7 skipped` while failing on a missing MinIO —
      # the exact thing every other step here guards against. A suite that
      # opts out because infrastructure is absent has proved nothing, and
      # this workflow exists to make that impossible.
      - name: Assert the sweep reported nothing skipped
        run: |
          if grep -qiE '[0-9]+ skipped' /tmp/sweep.log; then
            echo "::error::A suite skipped during the full sweep. It did not run."
            grep -iE '[0-9]+ skipped' /tmp/sweep.log
            exit 1
          fi
