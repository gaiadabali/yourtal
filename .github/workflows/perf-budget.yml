# YT-0404 — Performance budget harness.
#
# Gates every PR on:
#   - initial JS (first-load JS, gzipped) for every route, ≤ 170 KB
#     (docs/13b-typescript-standards.md §8) — build-time check against
#     Next's own output, see scripts/perf-check-bundle-size.mjs.
#   - Lighthouse CI, throttled to mid-tier Android over 4G
#     (docs/08-web-app-and-performance.md §3) — LCP ≤ 2.0s, CLS ≤ 0.1, and
#     Total Blocking Time ≤ 200ms as the lab proxy for INP (Lighthouse
#     cannot measure INP itself — see apps/web/lighthouserc.cjs for why).
# and posts a bundle-size report as a single, updated PR comment.
#
# Runs on PRs, and on pushes to main that touch the web app or the UI kit.
name: Performance budget

on:
  # Runnable on demand. A gate whose paths happen to match nothing cannot
  # otherwise be proved to run — go.yml sat unexecuted through six pushes.
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - ".github/workflows/perf-budget.yml"
  # A budget regression that lands on main without a PR still gets caught.
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"

# Superseded runs on the same PR are pointless — cancel them to free runners.
concurrency:
  group: perf-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write # required to post/update the sticky bundle-size comment

jobs:
  perf-budget:
    name: Lighthouse CI + bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # field (pnpm@11.3.0), so this action and the local dev toolchain
        # can never drift apart.

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Chrome for Lighthouse
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          # "stable" rather than a pinned build number: Google periodically
          # deprecates old chrome-for-testing binaries out from under a
          # pinned version, which would silently break this workflow with
          # no code change to blame. ubuntu-latest's own image Chrome would
          # be an alternative, but pinning the setup-chrome *action* version
          # above still gives us a reproducible install step; only the
          # browser build itself intentionally floats on "stable".
          chrome-version: stable

      - name: Build web app
        # Turborepo builds @yourtal/web and anything it depends on
        # (packages/ui, packages/contracts) in the right order, with caching.
        run: pnpm exec turbo run build --filter=@yourtal/web
        env:
          CI: "true"

      - name: Generate bundle-size report
        run: node scripts/perf-bundle-report.mjs apps/web bundle-report.md

      # Pushes have no PR, and a fork's token cannot comment.
      - name: Post bundle-size report on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("bundle-report.md", "utf8");
            const marker = "<!-- yourtal-perf-budget-bundle-report -->";
            const commentBody = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }

      - name: Enforce initial-JS budget (170 KB gz)
        run: node scripts/perf-check-bundle-size.mjs apps/web

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
      # needs ("No usable sandbox!"). Lift that on this runner rather than
      # running Chrome with --no-sandbox.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run Lighthouse CI (mid-tier Android / 4G)
        # Run through dlx rather than as a devDependency: @lhci/cli 0.15.1 is
        # the latest release, and it pins lighthouse 12.6.1, whose tree carries
        # extract-zip/tmp/uuid advisories. dlx keeps them out of pnpm-lock.yaml.
        working-directory: apps/web
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
