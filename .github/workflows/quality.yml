# Correctness gates. The performance gates live in perf-budget.yml.
#
# Until this existed, CI ran neither lint, typecheck nor tests — and for a
# while `pnpm lint` was a no-op besides, because no eslint config had been
# written. docs/13b-typescript-standards.md §2 calls type-aware linting a
# build gate; this is what makes that true.
name: Quality

on:
  # Runnable on demand. A gate whose paths happen to match nothing cannot
  # otherwise be proved to run — go.yml sat unexecuted through six pushes.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, task dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.0.0
        # Version comes from the root package.json "packageManager" field.

      - name: Set up Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The SAME command `pnpm verify` runs locally. It used to be
      # `pnpm exec eslint apps packages`, which linted a different file set
      # from every package's own `lint` script — so local green predicted
      # nothing about CI. The first CI run that ever executed reported 72
      # errors that no developer could reproduce: it was parsing the MPEG-TS
      # media fixtures as TypeScript, which the per-package `eslint src`
      # scope never reached. Two commands, two file sets, one of them wrong.
      - name: Lint
        run: pnpm exec turbo run lint

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      # There is deliberately NO test step here.
      #
      # This workflow stands up no services, and several suites are
      # Postgres-backed by design — `@yourtal/idempotency`'s
      # `postgres-store.test.ts` opens a pool in `beforeAll`. Running
      # `turbo run test` here failed with ECONNREFUSED on 26432, which is
      # the CORRECT behaviour: those suites refuse to pretend. A suite that
      # quietly skipped without a database would be the far worse outcome,
      # and `integration.yml` fails the build on any SKIP for that reason.
      #
      # The wrong fix is to filter the DB-backed packages out here. That
      # recreates exactly the divergence the Lint comment above describes —
      # two commands over two sets, neither matching `pnpm verify`. Tests
      # live in `integration.yml`, which has Postgres and a live PDP; this
      # workflow stays what its name says: lint, typecheck, and the board.
