# Correctness gates. The performance gates live in perf-budget.yml.
#
# Until this existed, CI ran neither lint, typecheck nor tests — and for a
# while `pnpm lint` was a no-op besides, because no eslint config had been
# written. docs/13b-typescript-standards.md §2 calls type-aware linting a
# build gate; this is what makes that true.
name: Quality

on:
  # Runnable on demand. A gate whose paths happen to match nothing cannot
  # otherwise be proved to run — go.yml sat unexecuted through six pushes.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: pnpm check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exactly what a developer runs locally, so local green predicts CI green.
      - name: pnpm check (line endings, format, typecheck, lint, unit tests)
        run: pnpm check
