# Publish the deploy artifact Helios's poller installs — YT-0532, decision S-1.
#
# THE DIVISION OF LABOUR. CI proves and publishes; the poller pulls and
# installs. They are not alternatives. `gaiada-poll` on Helios watches this
# repository for a release tagged `deploy/production-*`, verifies the
# checksum, and hands the tarball to `gaiada-deploy`, which does the
# releases/ + symlink swap and reloads pm2. Nothing here reaches into the
# server, and the server opens no port for us.
#
# WHY PULL AND NOT PUSH. Helios permits SSH per source IP, and that allowlist
# is what protects the 30 live client sites on the box. GitHub runners egress
# from thousands of rotating addresses, so push-deploy means opening 22
# broadly — discarding the control in order to automate the thing it
# protects. Recorded as decision S-1 in docs/16.
#
# THE GATE IS UPSTREAM. The poller installs whatever it is handed, so this
# workflow must not publish from a red tree. It re-runs the checks rather
# than trusting that some earlier run was green: a release is exactly the
# moment `docs/13d` §7 warns about, where a cached or assumed pass would
# authorise something.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "TASKS.md"
      - "**/*.md"
  workflow_dispatch:

# `cancel-in-progress: false`, deliberately: two pushes to main must publish
# in order, not have the first cancelled mid-release. Ordering is also why an
# older run cannot un-do a newer one at the fast-forward step below — a
# fast-forward-only push is refused outright if `production` has already
# moved past that run's SHA, so a slow run finishing after a faster later one
# fails loudly instead of rolling `production` backwards.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build runs with a read-only token: a compromised dependency executing
  # during `pnpm install` or the build cannot publish anything.
  build:
    name: Build the deploy artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm check

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/ledger/go.mod
          cache: false

      - name: Build the web app, api and worker
        run: |
          pnpm --filter @yourtal/web build
          pnpm --filter @yourtal/api build
          pnpm --filter @yourtal/worker build

      # One artifact, one gaiada-deploy target (2.1.b): the agent swaps one
      # `current` per site user, so api, worker and the Go services ride in the
      # same release as web and reload together. Layout: infra/HELIOS.md.
      - name: Assemble the artifact
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/yourtal"
          mkdir -p "$STAGE/apps/web/.next" "$STAGE/bin" "$STAGE/deploy"
          cp -r apps/web/.next/standalone/. "$STAGE"/
          cp -r apps/web/.next/static "$STAGE/apps/web/.next/static"
          if [ -d apps/web/public ]; then cp -r apps/web/public "$STAGE/apps/web/public"; fi
          pnpm --filter @yourtal/api deploy --prod "$STAGE/api"
          pnpm --filter @yourtal/worker deploy --prod "$STAGE/worker"
          for svc in ledger voucher; do
            (cd "services/$svc" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64               go build -trimpath -ldflags="-s -w" -o "$STAGE/bin/$svc" "./cmd/$svc")
          done
          cp -r packages/db/migrations "$STAGE/migrations"
          cp -r policies "$STAGE/policies"
          cp infra/helios/pre-reload.sh infra/helios/set-role-passwords.mjs             infra/helios/run-with-env.sh infra/helios/ecosystem.config.cjs "$STAGE/deploy/"
          chmod 755 "$STAGE/deploy/"*.sh "$STAGE/bin/"*
          echo "$GITHUB_SHA" > "$STAGE/REVISION"
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/yourtal.tar.gz" -C "$STAGE" .
          cd "$RUNNER_TEMP/out" && sha256sum yourtal.tar.gz > yourtal.tar.gz.sha256
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yourtal
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  # Publish only creates the release. It installs and runs no project code.
  publish:
    name: Publish deploy/production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yourtal
          path: out

      - name: Verify the checksum
        working-directory: out
        run: sha256sum -c yourtal.tar.gz.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="deploy/production-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "$TAG"             --notes "Automated deploy artifact for Helios from ${GITHUB_SHA}."             out/yourtal.tar.gz             out/yourtal.tar.gz.sha256
          echo "published $TAG"

      # `gaiada-poll` reads .gaiadeploy.yml from `production`, not `main`
      # (infra/HELIOS.md), so a release nobody promotes never reaches the
      # poller. Only this step needs write access to the checkout — the
      # build job above stays read-only throughout.
      - name: Checkout at the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Full history: git refuses a push it cannot prove is a fast-forward,
          # and a depth-1 clone does not hold production's current tip.
          fetch-depth: 0

      - name: Fast-forward production to this release
        run: |
          set -euo pipefail
          # Fast-forward only, never --force: if `production` has moved past
          # this SHA (an older run finishing late, or a manual push), the
          # push is rejected and the job fails loudly rather than rewinding
          # what the poller has already installed.
          git push origin "${GITHUB_SHA}:refs/heads/production"
