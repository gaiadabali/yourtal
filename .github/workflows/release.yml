# Publish the deploy artifact Helios's poller installs — YT-0532, decision S-1.
#
# THE DIVISION OF LABOUR. CI proves and publishes; the poller pulls and
# installs. They are not alternatives. `gaiada-poll` on Helios watches this
# repository for a release tagged `deploy/production-*`, verifies the
# checksum, and hands the tarball to `gaiada-deploy`, which does the
# releases/ + symlink swap and reloads pm2. Nothing here reaches into the
# server, and the server opens no port for us.
#
# WHY PULL AND NOT PUSH. Helios permits SSH per source IP, and that allowlist
# is what protects the 30 live client sites on the box. GitHub runners egress
# from thousands of rotating addresses, so push-deploy means opening 22
# broadly — discarding the control in order to automate the thing it
# protects. Recorded as decision S-1 in docs/16.
#
# THE GATE IS UPSTREAM. The poller installs whatever it is handed, so this
# workflow must not publish from a red tree. It re-runs the checks rather
# than trusting that some earlier run was green: a release is exactly the
# moment `docs/13d` §7 warns about, where a cached or assumed pass would
# authorise something.
name: Release

on:
  push:
    branches: [production]
    paths-ignore:
      - "docs/**"
      - "TASKS.md"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Build runs with a read-only token: a compromised dependency executing
  # during `pnpm install` or the build cannot publish anything.
  build:
    name: Build the deploy artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm check

      - name: Build the web app
        run: pnpm --filter @yourtal/web build

      - name: Assemble the artifact
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/yourtal-web"
          mkdir -p "$STAGE"
          cp -r apps/web/.next/standalone/. "$STAGE"/
          mkdir -p "$STAGE/apps/web/.next"
          cp -r apps/web/.next/static "$STAGE/apps/web/.next/static"
          if [ -d apps/web/public ]; then cp -r apps/web/public "$STAGE/apps/web/public"; fi
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/yourtal-web.tar.gz" -C "$STAGE" .
          cd "$RUNNER_TEMP/out" && sha256sum yourtal-web.tar.gz > yourtal-web.tar.gz.sha256
          ls -l "$RUNNER_TEMP/out"

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yourtal-web
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

  # Publish only creates the release. It installs and runs no project code.
  publish:
    name: Publish deploy/production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yourtal-web
          path: out

      - name: Verify the checksum
        working-directory: out
        run: sha256sum -c yourtal-web.tar.gz.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="deploy/production-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "$TAG"             --notes "Automated deploy artifact for Helios from ${GITHUB_SHA}."             out/yourtal-web.tar.gz             out/yourtal-web.tar.gz.sha256
          echo "published $TAG"
