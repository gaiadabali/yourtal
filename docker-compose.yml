# YourTal local development stack — YT-0516.
#
# Needs no cloud account. YT-0022 provisions *managed* Postgres in GCP for
# *deployed* environments; local development was never dependent on it, and
# treating them as one dependency is why `apps/api` had never booted.
#
#   pnpm dev:up      start everything, wait for health
#   pnpm dev:down    stop, keep data
#   pnpm dev:reset   stop and destroy the volume
#
# Ports are deliberately in the 26xxx range: this machine already runs
# Postgres for other projects on 5432, 15432, 55499 and 55510.
#
# Local voucher keyring: `voucher-keygen` below generates one automatically
# into the `yourtal-voucher-keys` volume the first time this stack comes up,
# so `pnpm dev:up` alone is enough — there is nothing to run by hand. To
# regenerate a key on purpose (never as a rotation procedure — see
# services/voucher/internal/keyring for that):
#
#   docker compose stop voucher
#   docker volume rm yourtal-voucher-keys
#   docker compose up -d voucher-keygen voucher
#
# The key never lives under this repo. services/voucher/internal/keyring
# refuses to load a master key that has a `.git` ancestor, by design, so it
# is generated straight into the named volume instead of anywhere a
# `git add -A` could ever reach.

# Pinned so every checkout (slot worktrees included) names the same stack.
# Worktrees must still run no compose command: this name makes them act on
# the shared one.
name: yourtal

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: yourtal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourtal
      POSTGRES_PASSWORD: yourtal_local_only
      POSTGRES_DB: yourtal
      # Deterministic collation so index ordering matches CI and production.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:26432:5432"
    volumes:
      # Postgres 18 keeps PGDATA at /var/lib/postgresql/18/docker, so the volume
      # mounts one level up. A new volume: the 17 one stays for rollback (2.4.d).
      - yourtal-pgdata18:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourtal -d yourtal"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      # Surface slow queries locally so a missing index is noticed here and
      # not in production.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.55.0@sha256:4b9d3b58c4f11c1b8953bc798d8d086e64f276882253ab169625fddc7f432515
    container_name: yourtal-cerbos
    restart: unless-stopped
    # Loopback only. docs/10 and docs/15 specify a sidecar, never a shared PDP.
    ports:
      - "127.0.0.1:26592:3592"
    volumes:
      - ./policies:/policies:ro
      - ./infra/cerbos/config.yaml:/config/config.yaml:ro
    command: ["server", "--config=/config/config.yaml"]
    healthcheck:
      test: ["CMD", "/cerbos", "healthcheck", "--config=/config/config.yaml"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: yourtal-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:26379:6379"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- YT-0520 / YT-0521: local substitutes for cloud services, so nothing
  # --- waits on an account signup. Same interfaces, real protocols.

  rustfs:
    # F58 (founder, 2026-09-28): MinIO replaced with RustFS. MinIO/pgsty's
    # fork was already a workaround for MinIO's own archived-with-CVEs repo;
    # RustFS is a from-scratch S3-compatible server, Apache-2.0, one port for
    # everything (S3 API + admin API + health), no bundled `mc`/console the
    # app depends on. Pinned by digest, its own 1.0.0 GA (2026-09-16).
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: yourtal-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: yourtal
      RUSTFS_ROOT_PASSWORD: yourtal_local_only
      # INFO, not the image's WARN default: at INFO, RustFS's own structured
      # JSON log (/logs/rustfs.log in the container) emits one
      # "http_request_completed" record per request (method, uri, status,
      # duration) — delivery-log.test.ts's replacement for `mc admin trace`,
      # which RustFS's own admin API accepts but never actually populates
      # for S3-level operations (confirmed empirically against a real
      # container: the endpoint streams real internal scanner events under
      # `all=true`, and the real `mc` client connects fine, but neither ever
      # emits a GetObject/PutObject record). DEBUG would also carry the
      # object's byte size, but at ~900 lines per request it is too noisy
      # for a healthcheck-adjacent log; the client's own Content-Length
      # response header is delivery-log.test.ts's byte-count evidence
      # instead (see that file's own header comment).
      RUSTFS_OBS_LOGGER_LEVEL: info
    # S3-compatible, so the R2 adapter is exercised rather than stubbed.
    ports:
      - "127.0.0.1:26900:9000"
    volumes:
      - yourtal-rustfs:/data
    healthcheck:
      # RustFS ships no `mc` (no CLI at all beyond its own `rustfs` binary),
      # but does answer an unauthenticated GET /health — needs `curl`,
      # confirmed present in the image.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- YT-0517 / docs/15's Phase 1 deployables #1 and #2: the two services
  # that actually move money. Both were previously absent from this file
  # entirely, which meant `pnpm dev:up` brought up everything AROUND them
  # and nothing able to call them.

  ledger:
    build:
      context: ./services/ledger
      dockerfile: Dockerfile
      # The Dockerfile's healthcheck probe lives under infra/healthcheck,
      # not inside this service's own tree — see that package's comment.
      additional_contexts:
        healthcheck: ./infra/healthcheck
    image: yourtal/ledger:local
    container_name: yourtal-ledger
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The yourtal_ledger credential — never yourtal_app (no grant on the
      # ledger schema at all, infra/postgres/init/01-schemas.sql) and never
      # the yourtal superuser. Connecting as either would be YT-0554's bug
      # one layer down. Local-only password, created by that same init
      # script.
      LEDGER_DATABASE_URL: postgres://yourtal_ledger:ledger_local_only@postgres:5432/yourtal
      # 0.0.0.0, not the binary's loopback-only default: a bind to
      # 127.0.0.1 inside this container's network namespace is invisible to
      # the port published below, which arrives on a different interface.
      LEDGER_ADDR: 0.0.0.0:3010
      # Local-only; matches .env.example so host-run api and worker can sign.
      LEDGER_SERVICE_SECRET: local-only-ledger-service-secret-not-real
      REWARD_ATTESTATION_SECRET: local-only-reward-attestation-secret-not-real
    ports:
      - "127.0.0.1:26910:3010"
    healthcheck:
      # /readyz, not /healthz: /healthz is pure liveness and stayed at 200
      # through a Postgres pause in testing, which means a healthcheck
      # pointed at it reports "can serve" while meaning only "process is
      # scheduled". /readyz pings the database with its own short budget and
      # fails closed if the pool is unset or the ping does not return in
      # time — see services/ledger/cmd/ledger/main.go for both handlers.
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:3010/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Generates the voucher service's master keyring on first run and then
  # exits. internal/keyring.FromDirectory (services/voucher) refuses to load
  # a master key that lives inside a git working tree — deliberately, so a
  # dev key can never be one `git add -A` away from being committed — so
  # this writes into a named DOCKER VOLUME instead of anything under this
  # repo. The volume is not the repo; nothing it holds has an ancestor
  # `.git`, so the control that refuses in-tree keys does not fire and does
  # not need to be worked around.
  #
  # A developer never has to run this by hand: `pnpm dev:up` brings it up
  # with everything else, `voucher` waits for it via
  # `condition: service_completed_successfully`, and it is a no-op on every
  # run after the first (see the `if` in `command` below). See "Local
  # voucher keyring" in this file's own comments at the top for what to do
  # if a key needs regenerating.
  voucher-keygen:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: yourtal-voucher-keygen
    volumes:
      - yourtal-voucher-keys:/keys
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for k in voucher_code merchant_hmac voucher_qr; do [ -f /keys/$$k.v1.key ] || head -c 32 /dev/urandom | od -An -vtx1 | tr -d ' \n' > /keys/$$k.v1.key; done

  voucher:
    build:
      context: ./services/voucher
      dockerfile: Dockerfile
      additional_contexts:
        healthcheck: ./infra/healthcheck
    image: yourtal/voucher:local
    container_name: yourtal-voucher
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      voucher-keygen:
        condition: service_completed_successfully
    environment:
      # The yourtal_voucher credential (packages/db/migrations/
      # …_voucher_custody.sql) — the same reasoning as the ledger's
      # LEDGER_DATABASE_URL above applies here without change.
      VOUCHER_DATABASE_URL: postgres://yourtal_voucher:voucher_local_only@postgres:5432/yourtal
      VOUCHER_ADDR: 0.0.0.0:3011
      # 4.5: /internal/v1 (apps/api, apps/worker) — see LEDGER_SERVICE_SECRET
      # above for the reasoning; same local-only default in .env.example.
      VOUCHER_SERVICE_SECRET: local-only-voucher-service-secret-not-real
      # 4.6.f.2: the capture outbox drains into the ledger, signed as "voucher".
      LEDGER_BASE_URL: http://ledger:3010
      LEDGER_SERVICE_SECRET: local-only-ledger-service-secret-not-real
      # Where the master keyring landed. loadKeys() in
      # services/voucher/cmd/voucher/main.go refuses to boot without this —
      # by design, see that file's package comment — so a missing or empty
      # volume fails the container rather than serving with no key.
      VOUCHER_KEY_DIR: /keys
    volumes:
      # Read-only: this service opens ciphertext with these keys, it never
      # needs to write one. Rotation is a deliberate, separate operation
      # (docs/15 rule and services/voucher/internal/keyring's Versions),
      # not something the running service should be able to do to its own
      # key material.
      - yourtal-voucher-keys:/keys:ro
    ports:
      - "127.0.0.1:26911:3011"
    healthcheck:
      # Still /healthz, unlike the ledger's healthcheck above — this is a
      # known, reported gap, not an oversight. voucher's main.go has the
      # same "does not touch the database" liveness-only /healthz the
      # ledger had before this pass, and it needs the same /readyz split
      # the ledger just got. But services/voucher/*.go is owned by another
      # change in flight right now and this pass may not touch it, so this
      # healthcheck cannot yet tell "process is up" from "can actually
      # serve" for this service. Follow-up, not fixed here.
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:3011/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  yourtal-pgdata18:
    name: yourtal-pgdata18
  yourtal-rustfs:
    name: yourtal-rustfs
  # The voucher master keyring. Deliberately its own volume rather than a
  # path under yourtal-pgdata or anything bind-mounted from this repo — see
  # the voucher-keygen service above for why "outside the git working tree"
  # is a hard requirement, not a preference.
  yourtal-voucher-keys:
    name: yourtal-voucher-keys
