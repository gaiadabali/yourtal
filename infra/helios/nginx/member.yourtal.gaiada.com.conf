# member.yourtal.gaiada.com on Helios: YourTal's app after the host move
# (owner, 2026-11-27; god/websites/HOST-MOVE-RUNBOOK.md). Hand-made, not a
# CloudPanel site: installed at /etc/nginx/sites-enabled/member.yourtal.gaiada.com.conf,
# always behind `nginx -t`. The same upstreams as yourtal.gaiada.com.conf.
#
# The OIDC rate-limit zones and the $yt_ip_key map it uses are defined once, in
# yourtal.gaiada.com.conf (both versions of it); a second definition fails `nginx -t`.
#
# Certificate: certbot webroot (certonly, so certbot never edits this file):
#   certbot certonly --webroot -w /home/uyourtal/htdocs/member.yourtal.gaiada.com
#     -d member.yourtal.gaiada.com --key-type ecdsa

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/letsencrypt/live/member.yourtal.gaiada.com/privkey.pem;
  ssl_certificate /etc/letsencrypt/live/member.yourtal.gaiada.com/fullchain.pem;
  server_name member.yourtal.gaiada.com;
  # Only the ACME challenge and /.well-known are ever read from here.
  root /home/uyourtal/htdocs/member.yourtal.gaiada.com;

  access_log /home/uyourtal/logs/nginx/member-access.log main;
  error_log /home/uyourtal/logs/nginx/member-error.log;

  # --- YourTal (13.3.e) --------------------------------------------------------
  # The box-wide nginx.conf trusts X-Real-IP from every address
  # (set_real_ip_from 0.0.0.0/0), so any client could pick its own $remote_addr
  # and walk past every per-IP limit. This list replaces it for this site only:
  # a client is its TCP peer. The app's own hops then pass $remote_addr on as
  # the only X-Forwarded-For entry, never appending to a client-written one.
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  index index.html;

  # --- YourTal ---------------------------------------------------------------
  # Staging posture (2.3.a) and baseline hardening, on every response.
  # Next hydrates through inline scripts, so script-src needs 'unsafe-inline'
  # until the app issues nonces; everything else is same-origin only.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Only nginx's own auth subrequest may reach the api's internal routes.
  location /api/internal/ {
    return 404;
  }

  # The simulated dev inbox (and every other /api/dev/ route) holds emailed
  # tokens for the demo world. Only the box itself may read it; the public
  # internet gets the same 404 the route gives in production (god-99, 2026-10-21).
  location /api/dev/ {
    return 404;
  }

  # Spambank's mail API (spambank/BUILD.md section 5.3): the JMAP proxy streams uploads (25 MB),
  # downloads and EventSource, so nothing is buffered and a read may idle 120 s (the
  # proxy pings at least every 60 s). `^~` keeps the regex locations off these paths.
  # No add_header here: one would drop the server-level headers in this location.
  location ^~ /api/spambank/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 26m;
    proxy_read_timeout 120;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
    proxy_read_timeout 60;
  }

  # Group 3.9: Sign in with YourTal, the OpenID Connect provider in the api
  # (docs/26 §1.1). `^~` so the `~ /.well-known` regex above cannot take
  # /oidc/.well-known/openid-configuration and answer 404 from the static
  # root. The path is forwarded unchanged. The provider builds its URLs and
  # secure cookies from Host and X-Forwarded-*, so they are fixed to the issuer
  # here (the api pins them to OIDC_ISSUER as well), never what a client sent.
  location ^~ /oidc/ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host member.yourtal.gaiada.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host member.yourtal.gaiada.com;
    client_max_body_size 64k;
    proxy_read_timeout 30;
    limit_req zone=yt_oidc_site burst=100 nodelay;
    limit_req_status 429;

    # A nested limit_req replaces the parent's, so the two below repeat the
    # site ceiling.
    # Each sign-in start stores a row, so it is limited per browser address.
    # Nested locations inherit the proxy_set_header lines above.
    location ^~ /oidc/auth {
      limit_req zone=yt_oidc_auth64 burst=20 nodelay;
      limit_req zone=yt_oidc_site burst=100 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:26301;
    }
    # Codes are redeemed by the apps' servers, which may share one address
    # (both run on Helios today), so this limit is per address and generous.
    location = /oidc/token {
      limit_req zone=yt_oidc_token64 burst=50 nodelay;
      limit_req zone=yt_oidc_site burst=100 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:26301;
    }
  }

  # The merchant redemption API (authorize/capture/void/refund). Each call is
  # HMAC-signed over its method, URI, idempotency key and body, so the URI is
  # forwarded exactly as received (no URI on proxy_pass). Only this prefix goes
  # to the voucher service: its /internal/** routes stay on loopback and fall
  # through to the web's 404 like any other unknown path.
  location /v1/vouchers/ {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:26303;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30;
  }

  # Posters, teasers and captions are public. The object store itself is loopback-only.
  location ~ ^/media/(posters|teasers|captions)/(.+)$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:26305/yourtal-media/$1/$2;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
    expires 1h;
    # Businesses upload listing pictures here, on the site's own origin: a sandboxed,
    # script-free document even if something other than an image ever lands. A location
    # add_header replaces the server's, so the others are repeated.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # HLS needs a per-session signature (EW-18, 5.1.d); the api checks it on
  # every manifest and segment. Format: apps/api/src/shared/media-auth/hls-token.ts
  #   /media/hls/<expires>/<token>/<sessionId>/<path>
  # The access log records each served segment with its session (10.4.c).
  location ~ ^/media/hls/\d+/[A-Za-z0-9_-]+/[A-Za-z0-9-]+/(.+)$ {
    limit_except GET HEAD { deny all; }
    set $yt_hls_path $1;
    auth_request /__yt_hls_auth;
    proxy_pass http://127.0.0.1:26305/yourtal-media/hls/$yt_hls_path;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
  }

  location = /__yt_hls_auth {
    internal;
    proxy_pass http://127.0.0.1:26301/api/internal/hls-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  location /media/ {
    return 404;
  }

  # 7.9.d/2026-09-28: a real browser PUTs presigned multipart-upload parts
  # straight to RustFS (`packages/media/src/studio-media.ts`'s
  # `createPresignClient()`, `MEDIA_PRESIGN_ENDPOINT`), which RustFS's own
  # loopback-only port cannot serve directly. SigV4 signs the request PATH
  # as part of the signature, so unlike the GET locations above this proxy
  # must NOT rewrite or strip the path — the bucket name in the URL is
  # deliberate, not a leak (RustFS's own bucket policy, not this location,
  # is what keeps `raw/` unreadable to an anonymous GET; this location only
  # ever admits PUT). `Host` must be forwarded exactly as received — it is
  # part of `SignedHeaders` too, and the app signs it as this vhost's own
  # host, not RustFS's loopback address (confirmed empirically: forwarding
  # `127.0.0.1:26305` as Host here 403s every request with
  # `SignatureDoesNotMatch`).
  location /yourtal-media/ {
    limit_except PUT { deny all; }
    client_max_body_size 16m; # MEDIA_UPLOAD_PART_SIZE_BYTES is 8 MB
    proxy_pass http://127.0.0.1:26305;
    proxy_set_header Host $host;
    proxy_hide_header Set-Cookie;
  }
  # --- end YourTal -------------------------------------------------------------

  location / {
    proxy_pass http://127.0.0.1:26300/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
