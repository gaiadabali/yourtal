# yourtal.gaiada.com on Helios (2.1.c). Installed at
# /etc/nginx/sites-enabled/yourtal.gaiada.com.conf, always behind `nginx -t`
# (infra/HELIOS.md). CloudPanel generated the frame; YourTal's additions are
# marked. If CloudPanel's editor is used on this site, re-apply this file.
#
# This nginx has no secure_link module, so signed HLS is checked by the api
# (auth_request -> /api/internal/hls-auth); the secret stays in app.env only.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/yourtal.gaiada.com.key;
  ssl_certificate /etc/nginx/ssl-certificates/yourtal.gaiada.com.crt;
  server_name yourtal.gaiada.com;
  root /home/uyourtal/htdocs/yourtal.gaiada.com;

  access_log /home/uyourtal/logs/nginx/access.log main;
  error_log /home/uyourtal/logs/nginx/error.log;

  # --- YourTal (13.3.e) --------------------------------------------------------
  # The box-wide nginx.conf trusts X-Real-IP from every address
  # (set_real_ip_from 0.0.0.0/0), so any client could pick its own $remote_addr
  # and walk past every per-IP limit. This list replaces it for this site only:
  # a client is its TCP peer. The app's own hops then pass $remote_addr on as
  # the only X-Forwarded-For entry, never appending to a client-written one.
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  index index.html;

  # --- YourTal ---------------------------------------------------------------
  # Staging posture (2.3.a) and baseline hardening, on every response.
  # Next hydrates through inline scripts, so script-src needs 'unsafe-inline'
  # until the app issues nonces; everything else is same-origin only.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Only nginx's own auth subrequest may reach the api's internal routes.
  location /api/internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
    proxy_read_timeout 60;
  }

  # Posters, teasers and captions are public. The object store itself is loopback-only.
  location ~ ^/media/(posters|teasers|captions)/(.+)$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:26305/yourtal-media/$1/$2;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
    expires 1h;
  }

  # HLS needs a per-session signature (EW-18, 5.1.d); the api checks it on
  # every manifest and segment. Format: apps/api/src/shared/media-auth/hls-token.ts
  #   /media/hls/<expires>/<token>/<sessionId>/<path>
  # The access log records each served segment with its session (10.4.c).
  location ~ ^/media/hls/\d+/[A-Za-z0-9_-]+/[A-Za-z0-9-]+/(.+)$ {
    limit_except GET HEAD { deny all; }
    set $yt_hls_path $1;
    auth_request /__yt_hls_auth;
    proxy_pass http://127.0.0.1:26305/yourtal-media/hls/$yt_hls_path;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
  }

  location = /__yt_hls_auth {
    internal;
    proxy_pass http://127.0.0.1:26301/api/internal/hls-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  location /media/ {
    return 404;
  }

  # 7.9.d/2026-09-28: a real browser PUTs presigned multipart-upload parts
  # straight to RustFS (`packages/media/src/studio-media.ts`'s
  # `createPresignClient()`, `MEDIA_PRESIGN_ENDPOINT`), which RustFS's own
  # loopback-only port cannot serve directly. SigV4 signs the request PATH
  # as part of the signature, so unlike the GET locations above this proxy
  # must NOT rewrite or strip the path — the bucket name in the URL is
  # deliberate, not a leak (RustFS's own bucket policy, not this location,
  # is what keeps `raw/` unreadable to an anonymous GET; this location only
  # ever admits PUT). `Host` must be forwarded exactly as received — it is
  # part of `SignedHeaders` too, and the app signs it as this vhost's own
  # host, not RustFS's loopback address (confirmed empirically: forwarding
  # `127.0.0.1:26305` as Host here 403s every request with
  # `SignatureDoesNotMatch`).
  location /yourtal-media/ {
    limit_except PUT { deny all; }
    client_max_body_size 16m; # MEDIA_UPLOAD_PART_SIZE_BYTES is 8 MB
    proxy_pass http://127.0.0.1:26305;
    proxy_set_header Host $host;
    proxy_hide_header Set-Cookie;
  }
  # --- end YourTal -------------------------------------------------------------

  location / {
    proxy_pass http://127.0.0.1:26300/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
