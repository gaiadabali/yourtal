# yourtal.gaiada.com on Helios (2.1.c). Installed at
# /etc/nginx/sites-enabled/yourtal.gaiada.com.conf, always behind `nginx -t`
# (infra/HELIOS.md). CloudPanel generated the frame; YourTal's additions are
# marked. If CloudPanel's editor is used on this site, re-apply this file.
#
# The HLS signing secret lives in /etc/nginx/yourtal-hls.conf (root, 0600),
# which sets $yt_hls_secret; app.env holds the same value as HLS_SIGNING_SECRET.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/yourtal.gaiada.com.key;
  ssl_certificate /etc/nginx/ssl-certificates/yourtal.gaiada.com.crt;
  server_name yourtal.gaiada.com;
  root /home/uyourtal/htdocs/yourtal.gaiada.com;

  access_log /home/uyourtal/logs/nginx/access.log main;
  error_log /home/uyourtal/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  index index.html;

  # --- YourTal ---------------------------------------------------------------
  include /etc/nginx/yourtal-hls.conf;

  # Staging posture (2.3.a) and baseline hardening, on every response.
  # Next hydrates through inline scripts, so script-src needs 'unsafe-inline'
  # until the app issues nonces; everything else is same-origin only.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /api/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
    proxy_read_timeout 60;
  }

  # Posters, teasers and captions are public. MinIO itself is loopback-only.
  location ~ ^/media/(posters|teasers|captions)/(.+)$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:26305/yourtal-media/$1/$2;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
    expires 1h;
  }

  # HLS needs a per-session signature (EW-18, 5.1.d):
  #   /media/hls/<expires>/<token>/<sessionId>/<path>
  #   token = base64url(md5("<expires><sessionId> <secret>")), no padding
  # The token covers the session, so relative segment URLs in the manifest
  # inherit it; the access log then records every segment served per session.
  location ~ ^/media/hls/(\d+)/([A-Za-z0-9_-]+)/([A-Za-z0-9-]+)/(.+)$ {
    limit_except GET HEAD { deny all; }
    set $yt_expires $1;
    set $yt_session $3;
    set $yt_path $4;
    secure_link $2,$1;
    secure_link_md5 "$yt_expires$yt_session $yt_hls_secret";
    if ($secure_link = "") { return 403; }
    if ($secure_link = "0") { return 410; }
    proxy_pass http://127.0.0.1:26305/yourtal-media/hls/$yt_path;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
  }

  location /media/ {
    return 404;
  }
  # --- end YourTal -------------------------------------------------------------

  location / {
    proxy_pass http://127.0.0.1:26300/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}
