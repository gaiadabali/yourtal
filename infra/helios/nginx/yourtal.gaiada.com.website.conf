# yourtal.gaiada.com on Helios AFTER the host move (owner, 2026-11-27;
# god/websites/HOST-MOVE-RUNBOOK.md, phase 3). It replaces yourtal.gaiada.com.conf
# at /etc/nginx/sites-enabled/yourtal.gaiada.com.conf, always behind `nginx -t`.
# The app now lives at member.yourtal.gaiada.com (member.yourtal.gaiada.com.conf).
#
# What this host does:
#   - The public website (Astro, static) from the CloudPanel docroot.
#   - Every app page 301s to member.yourtal.gaiada.com with its path and query, so
#     links already sent (guardian, verify, reset, studio join, security notices,
#     SnapApps' /me /wallet /passkey) keep working. A path the website does not
#     have falls through to the same redirect.
#   - Proxied, not redirected, because their callers do not follow redirects or
#     drop credentials on them: the one-click opt-out POSTs already sent in
#     auto-replies (forever), the Stalwart webhook and the JMAP proxy, every other
#     /api/ call from app servers, the merchant voucher API, and public media.
#   - /oidc/ 308s to the new issuer's paths. The issuer is member.*: a relying
#     party still configured with this host fails closed on the issuer check,
#     with or without this redirect.
#   - /sw.js is a kill switch for the app's old service worker (scope /).
#
# The OIDC zones and map stay here (member.* uses them); define them once.
map $binary_remote_addr $yt_ip_key {
  "~(?s)^(?<yt_v6_net>.{8}).{8}$" $yt_v6_net;
  default $binary_remote_addr;
}
limit_req_zone $yt_ip_key zone=yt_oidc_auth64:10m rate=30r/m;
limit_req_zone $yt_ip_key zone=yt_oidc_token64:10m rate=10r/s;
limit_req_zone $server_name zone=yt_oidc_site:1m rate=50r/s;

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/yourtal.gaiada.com.key;
  ssl_certificate /etc/nginx/ssl-certificates/yourtal.gaiada.com.crt;
  server_name yourtal.gaiada.com;
  # The website's build output. CloudPanel's own docroot, so its certificate
  # renewal keeps finding /.well-known/acme-challenge/ where it writes it.
  root /home/uyourtal/htdocs/yourtal.gaiada.com;

  access_log /home/uyourtal/logs/nginx/access.log main;
  error_log /home/uyourtal/logs/nginx/error.log;

  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  index index.html;

  # The website's headers (god/yourtal-website/SECURITY-HEADERS.md, 2026-11-27).
  # HSTS without includeSubDomains until the owner decides (it would cover every
  # *.yourtal.gaiada.com name). X-Robots-Tag only while this is staging.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

  # --- Kept for callers that cannot follow a redirect ---------------------------
  location /api/internal/ {
    return 404;
  }
  location /api/dev/ {
    return 404;
  }

  # One-click opt-out (RFC 8058) in auto-replies already sent: mail providers POST
  # here and do not follow redirects. Must keep working forever.
  location ^~ /api/spambank/optout/ {
    limit_except GET POST OPTIONS { deny all; }
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30;
  }

  # The Stalwart webhook (until it names member.*) and the JMAP proxy for mail
  # clients that cached the old session URL. Same settings as the app's host.
  location ^~ /api/spambank/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 26m;
    proxy_read_timeout 120;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # App servers (SnapApps, Free Tax Returns) whose YourTal API URL still names
  # this host. A redirect would drop their Authorization header (fetch strips it
  # on a cross-origin redirect), so this is proxied.
  location /api/ {
    proxy_pass http://127.0.0.1:26301;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
    proxy_read_timeout 60;
  }

  # Merchants configured with this host. HMAC over method, URI, key and body; the
  # host is not signed, so a proxy keeps their calls valid.
  location /v1/vouchers/ {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:26303;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
    proxy_read_timeout 30;
  }

  # Public media whose stored URL still names this host (runbook step 2.6 rewrites
  # them; anything it missed keeps loading).
  location ~ ^/media/(posters|teasers|captions)/(.+)$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:26305/yourtal-media/$1/$2;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
    expires 1h;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location ~ ^/media/hls/\d+/[A-Za-z0-9_-]+/[A-Za-z0-9-]+/(.+)$ {
    limit_except GET HEAD { deny all; }
    set $yt_hls_path $1;
    auth_request /__yt_hls_auth;
    proxy_pass http://127.0.0.1:26305/yourtal-media/hls/$yt_hls_path;
    proxy_set_header Host 127.0.0.1:26305;
    proxy_hide_header Set-Cookie;
  }

  location = /__yt_hls_auth {
    internal;
    proxy_pass http://127.0.0.1:26301/api/internal/hls-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  location /media/ {
    return 404;
  }

  # --- The issuer moved -------------------------------------------------------
  location ^~ /oidc/ {
    return 308 https://member.yourtal.gaiada.com$request_uri;
  }

  # --- The app's old service worker -------------------------------------------
  # The app registered /sw.js with scope /. A browser re-fetches it on its update
  # check; this one clears the caches, unregisters itself and reloads the tabs.
  location = /sw.js {
    alias /home/uyourtal/sw-killswitch/sw.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
  }

  # --- App pages: 301 to member.* -------------------------------------------------
  # Every top-level route in apps/web/app (route groups (app), (auth), (business),
  # (charity), (guardian), (landing), (merchant), (staff) and the Spambank
  # opt-out page), plus Next's own assets. Wins over a website file of the same name.
  # `au` is the app's Australian public surface (guardian emails link /au/privacy);
  # `id` is left to the fallback below, because the website owns /id/ once its
  # Indonesian pages are on.
  location ~ ^/(_next|au|auctions|c|campaign|charities|charity|connect|dev|forgot|guardian|home|login|mail|me|merchant|onboarding|passkey|quick|register|reset|review|search|shorts|signup|spambank|staff|store|studio|verify|wallet|watch)(/|$) {
    return 301 https://member.yourtal.gaiada.com$request_uri;
  }

  # --- The website ------------------------------------------------------------
  # Anything the website does not have is treated as an old app link and sent to
  # member.* (whose 404 answers a real typo). The website's 404.html is therefore
  # unused; swap @member for =404 plus `error_page 404 /404.html;` if the owner
  # prefers the website's own 404 (runbook, owner decisions).
  location / {
    try_files $uri $uri/ @member;
  }

  # Hashed file names: cache for a year. A location add_header replaces the
  # server's, so the security headers are repeated.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location @member {
    return 301 https://member.yourtal.gaiada.com$request_uri;
  }
}
