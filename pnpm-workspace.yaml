packages:
  - "apps/*"
  - "packages/*"
  # Go services live here (docs/15). Declared now so they have a configured
  # home before the first one lands — YT-0517.
  - "services/*"
# Both are native build steps pulled in by next-intl (docs/15 locks it for
# id-ID / en-AU). pnpm 11 blocks postinstall scripts by default and treats an
# unanswered prompt as a fatal dep-status failure, which breaks `next build`.
# Both are legitimate compiler/watcher binaries, not arbitrary scripts.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  # YT-0588: esbuild bundles app/sw.ts into public/sw.js
  # (apps/web/scripts/build-service-worker.mjs). Same category as the two
  # above — a compiler binary, not an arbitrary script.
  esbuild: true
# Supply-chain cooldown: refuse any version published less than a day ago.
# Declared explicitly so a pnpm upgrade cannot silently change it; the pnpm 11
# default happens to be the same 1440 minutes.
minimumReleaseAge: 1440
overrides:
  # GHSA-c83g-rgw3-j3cx and GHSA-73wf-gq98-2v4g (high). @serwist/next 9.5.12
  # pins browserslist 4.28.6 exactly, and no serwist release fixes it yet.
  # Drop this once serwist unpins it (TASKS.md 0.8.g).
  "browserslist@<4.28.7": "4.29.0"
  # GHSA-698v-4r3x-3vcv (moderate, 2026-10-20): vite 8.3.0-8.3.2 bundles a launch-editor
  # that skips % escaping on Windows. vite comes in only through vitest (dev-only).
  # Drop this once vitest itself resolves vite >= 8.3.3.
  "vite@>=8.3.0 <8.3.3": "8.3.4"
  # 1.32: advisories on transitive pins whose parents have not moved yet
  # (serwist, nestjs, vitest, jsdom, ajv, eslint). Drop each once its parent resolves a patched version.
  "next@>=16.0.0 <16.4.1": "16.4.3"
  "zod@<4.6.6": "4.6.7"
  "undici@<8.12.2": "8.12.3"
  "fastify@<5.12.6": "5.12.7"
  "@vitest/mocker@<5.0.3": "5.0.5"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "4.2.3"
  "minimatch@<11.0.1": "11.0.3"
  "glob@>=9.0.0 <14.0.2": "14.0.3"
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm (high): braces <=3.0.3 stack exhaustion on deeply
    # nested patterns; no patched release exists (2026-10-07). Only reachable
    # as a dev-time dep (@next/eslint-plugin-next > fast-glob > micromatch),
    # never on untrusted input. Remove once a fixed braces ships.
    - GHSA-vfj7-8cjw-p6xm
    # GHSA-gcqx-w48m-w2h4 (low): deepmerge <=4.3.1 prototype poisoning in
    # mergeObject(); no patched release (2026-11-02). Reached only through
    # nestjs-zod, merging our own schema objects, never request input.
    # Remove once a fixed deepmerge ships.
    - GHSA-gcqx-w48m-w2h4
