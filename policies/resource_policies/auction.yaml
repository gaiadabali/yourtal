---
apiVersion: api.cerbos.dev/v1
description: |-
  13.22 (F86): charity auctions. Verified adults in the auction's own region
  browse and bid in cash; the winner pays the charity directly. Teens take
  no part at all, and AU and ID never cross. Who bid is never a resource
  attribute, so no rule here can expose it.
resourcePolicy:
  version: default
  resource: auction
  importDerivedRoles:
    - common
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/auction.json
  rules:
    - name: teens-take-no-part
      actions: ["view", "bid", "view_card", "update_card"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: has(P.attr.ageBand) && P.attr.ageBand == "teen"

    - name: f2-region-wall
      actions: ["view", "bid", "view_card", "update_card"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: R.attr.region != P.attr.jurisdiction

    - name: adults-browse
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["user"]

    - name: adults-in-good-standing-bid
      actions: ["bid"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: P.attr.isSuspended == false
              - expr: has(P.attr.ageBand) && P.attr.ageBand == "adult"
              - expr: "!has(P.attr.valueFrozenUntil) || now() > timestamp(P.attr.valueFrozenUntil)"
              - expr: "!has(R.attr.sellerId) || R.attr.sellerId != P.id"

    # The card a bid holds is the bidder's own: only a verified adult in good standing keeps one.
    # Frozen value does not stop saving a card, only bidding.
    - name: adults-keep-a-bidding-card
      actions: ["view_card", "update_card"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: P.attr.isSuspended == false
              - expr: has(P.attr.ageBand) && P.attr.ageBand == "adult"

    # 13.22.g: ops see every region's open auctions and cancel one only with a
    # reason (every hold released, the voucher back to the seller, audited).
    - name: ops-review-auctions
      actions: ["review"]
      effect: EFFECT_ALLOW
      roles: ["ops"]

    - name: ops-cancel-with-a-reason
      actions: ["cancel"]
      effect: EFFECT_ALLOW
      roles: ["ops"]
      condition:
        match:
          expr: has(R.attr.hasReason) && R.attr.hasReason == true
