---
apiVersion: api.cerbos.dev/v1
description: |-
  Point pre-purchases, settlement statements, invoices and disputes
  (docs/17 section 2, Billing zone). Owner and Finance edit; Admin may look
  but not spend.
resourcePolicy:
  version: default
  resource: billing
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/billing.json
  rules:
    - name: owner-and-finance-spend
      actions: ["purchase_points", "raise_dispute", "update_payment_method"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_billing_editor_of

    - name: admin-looks-but-does-not-spend
      actions: ["view", "view_statement"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_billing_viewer_of

    - name: internal-finance-reconciles
      actions: ["view", "view_statement"]
      effect: EFFECT_ALLOW
      roles: ["finance"]

    - name: staff-work-the-settlement-queue
      # TASKS.md 10.6.a: the staff console's own statement queue and dispute
      # resolution -- finance runs it day to day, ops can see and act on it
      # too (same "ops looks after finance where it needs a second pair of
      # hands" shape 9.5's kill switches use), neither is a business role.
      actions: ["view_statement_queue", "resolve_dispute"]
      effect: EFFECT_ALLOW
      roles: ["finance", "ops"]

    - name: f2-region-wall
      # 1.5.b: AU and ID are separate economies (F2) -- a consumer or
      # business-side caller may never act on a resource governed by the
      # OTHER region, even if some other rule above would otherwise allow
      # it. Scoped to user/business_user only: internal staff (support,
      # moderator, finance, ops, risk_analyst, admin) cross regions by design
      # (docs/17 section 5), and store_device already names one business via
      # its own credential (1.5.c). has(R.attr.region) makes this a no-op
      # for an action with no resource yet (a create) or a kind whose
      # controller does not populate region yet.
      actions:
        ["view", "view_statement", "purchase_points", "raise_dispute", "update_payment_method"]
      effect: EFFECT_DENY
      roles: ["user", "business_user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
