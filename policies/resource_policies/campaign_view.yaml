---
apiVersion: api.cerbos.dev/v1
description: |-
  Consumer and anonymous playback -- docs/17 section 4, Open Viewing.

  The line this policy draws is CLAIMABILITY, not anonymity (section 4.1).
  An anonymous visitor may watch a full campaign video; they may never earn,
  and there is no path by which the watch becomes claimable later. That is
  what makes Open Viewing safe rather than a free farming surface, so `earn`
  is denied to the anonymous role outright and not merely left un-granted.

  Open viewing is also BILLED (section 4.2). An open view against a campaign
  whose open-viewing budget is exhausted is an unfunded delivery bill, so the
  PDP refuses it -- "every delivered minute must belong to a funded campaign".
resourcePolicy:
  version: default
  resource: campaign_view
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/campaign_view.json
  rules:
    - name: the-list-is-browsable-by-anyone
      # 12.1.f: `GET /api/campaigns` (`CampaignController.list`) names no
      # single campaign -- `CampaignViewAttributeLoader.resolve` returns
      # `undefined` for it (see that file's own class comment), so `PdpGuard`
      # asks this action with a synthetic id and a placeholder
      # `campaignId` (the schema's only required field) and no other
      # attribute at all. There is therefore nothing here to condition on:
      # live state, F2 region and the audience wall are enforced by the
      # list's own SQL instead (`campaign.controller.ts`'s
      # `resolveCatalogueScope` + `reachableAudiences`), the same pair
      # `catalogue-scope.ts` already uses for the store's public list.
      # Deliberately its own action, never `watch_open` -- that action's
      # rules below all key on real per-campaign attributes this route
      # cannot supply, which is defect #1 this rule fixes: before it, the
      # list 403'd for every signed-in caller and 401'd anonymous outright.
      actions: ["browse"]
      effect: EFFECT_ALLOW
      roles: ["user", "anonymous"]

    - name: anonymous-can-never-earn
      actions: ["earn", "answer_scored", "resume_session"]
      effect: EFFECT_DENY
      roles: ["anonymous"]

    - name: open-viewing-is-opt-in-and-funded
      actions: ["watch_open"]
      effect: EFFECT_ALLOW
      roles: ["anonymous"]
      condition:
        match:
          all:
            of:
              - expr: has(R.attr.state) && R.attr.state == "live"
              - expr: has(R.attr.openViewingEnabled) && R.attr.openViewingEnabled
              - expr: has(R.attr.openViewingBudgetRemaining) && R.attr.openViewingBudgetRemaining > 0
              # F8/11.2.b, defence in depth: Studio's own category-policy.ts
              # already refuses to enable Open Viewing on anything but an
              # all_ages campaign, so this should be structurally
              # impossible to fail -- but a policy that plays an adult-rated
              # campaign logged out for a single bad row is the wrong
              # failure to leave to "should never happen".
              - expr: has(R.attr.audience) && R.attr.audience == "all_ages"

    - name: signed-in-viewers-watch-and-earn
      actions: ["watch_open", "watch_rewarded", "earn", "answer_scored", "resume_session"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: has(R.attr.state) && R.attr.state == "live"
              - expr: P.attr.isSuspended == false

    - name: suspended-users-do-not-earn
      actions: ["earn", "answer_scored"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: P.attr.isSuspended

    - name: audience-wall
      # 1.1.c/1.5.b: mirrors packages/contracts/src/audience/audience.ts's
      # `reachesAudience` exactly -- `all_ages` reaches everyone; `teen`
      # needs P.attr.ageBand == "teen"; `adult`/`parents` need "adult". No
      # ageBand at all (anonymous, or a signed-in principal missing one)
      # reaches only `all_ages` -- fail closed, the same choice
      # `resolveCatalogueScope`/`reachableAudiences` make for every list.
      # `has(R.attr.audience)` makes this a no-op for anything the loader
      # has not populated (there is none today -- CampaignViewAttributeLoader
      # always sends it -- but a future caller that forgets to would DENY
      # everything rather than allow, which is the safe direction to fail
      # missing on).
      actions: ["watch_open", "watch_rewarded", "earn", "answer_scored", "resume_session"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: |-
            has(R.attr.audience) && R.attr.audience != "all_ages" &&
            (
              (R.attr.audience == "teen" &&
                (!has(P.attr.ageBand) || P.attr.ageBand != "teen")) ||
              ((R.attr.audience == "adult" || R.attr.audience == "parents") &&
                (!has(P.attr.ageBand) || P.attr.ageBand != "adult"))
            )

    - name: teen-earns-only-with-guardian-consent
      # 12.1.a/12.1.c: a teen may browse (watch_open) freely once
      # audience-wall above admits them, but never earn without an ACTIVE
      # guardian consent grant. Pending (never yet granted) and revoked
      # (granted, then withdrawn) both deny -- only "granted" opens
      # watch_rewarded/earn/answer_scored/resume_session. An adult is
      # unaffected: this rule only ever matches P.attr.ageBand == "teen".
      actions: ["watch_rewarded", "earn", "answer_scored", "resume_session"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: |-
            has(P.attr.ageBand) && P.attr.ageBand == "teen" &&
            (!has(P.attr.guardianConsent) || P.attr.guardianConsent != "granted")

    - name: f2-region-wall
      # 1.5.b: a signed-in viewer never watches a campaign from the OTHER
      # region — 1.5.d's CampaignViewAttributeLoader already supplies
      # R.attr.region for every route here. Anonymous is exempt: an Open
      # Viewing visitor has no registered region to wall in the first place
      # (docs/17 section 4), and watch_open's own funded/opt-in conditions
      # are the control that applies to them.
      actions: ["watch_open", "watch_rewarded", "earn", "answer_scored", "resume_session"]
      effect: EFFECT_DENY
      roles: ["user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
