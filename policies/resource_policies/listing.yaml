---
apiVersion: api.cerbos.dev/v1
description: |-
  Store inventory (docs/17 section 2, Inventory zone).

  Lowering a settlement value S by more than the threshold is one of the three
  two-person-approval actions in docs/17 section 2.1. It matters because S is
  what the platform owes the merchant at redemption: a quiet downward revision
  moves real money, so the approver must be a different human from the
  requester. The PDP is where "a different human" is actually enforced -- a
  service-side check is the kind of thing that survives until someone needs a
  hotfix at 3am.
resourcePolicy:
  version: default
  resource: listing
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/listing.json
  rules:
    - name: nobody-approves-their-own-settlement-cut
      actions: ["approve_settlement_decrease"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: has(R.attr.requestedBy) && R.attr.requestedBy == P.id

    # Ordinary inventory work. NO materiality condition, deliberately.
    #
    # YT-0574 originally put the `has(...)` condition on a single rule
    # covering all four actions, and that over-denied: `create`, `edit` and
    # `archive` are wired with `@Authorize` alone, which supplies no
    # attributes at all, so requiring positive evidence denied every
    # ordinary listing edit over HTTP. Isolated against a fresh sidecar:
    # attribute absent gave create/edit/archive/set_settlement_value all
    # EFFECT_DENY; attribute present and false gave all four EFFECT_ALLOW.
    #
    # Nothing caught it. The policy fixtures supply the attribute by hand,
    # so the suite was 390/390 green, and no test drives these three
    # routes over HTTP (zero `inject` calls in the store controller tests).
    # That is the SAME failure YT-0574 itself records, one level out, and
    # the same failure as the reverted `required` schema change: a control
    # added to a definition SHARED by several actions is not scoped to the
    # one action that motivated it.
    - name: merchandisers-run-inventory
      actions: ["create", "edit", "archive"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_editor_of

    # The settlement value is the only action materiality gates, so the
    # condition lives on its own rule where it cannot reach anything else.
    - name: settlement-value-needs-positive-evidence
      actions: ["set_settlement_value"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_editor_of
      condition:
        match:
          # A material decrease is not an edit; it is a request that must then
          # be approved. Route it to approve_settlement_decrease instead.
          #
          # YT-0574: this MUST require positive evidence the change is not
          # material. The earlier form -- `!has(x) || !x` -- read a MISSING
          # attribute as "safe" and allowed, which is backwards: `attrsFrom`
          # is synchronous and request-only (see
          # `material-settlement-decrease.ts`), so the normal, correct way to
          # wire a controller supplies no attribute at all, and that used to
          # silently disable this control. `policies/tests/
          # two_person_approval_test.yaml`'s YT-0574 case fails against the
          # old expression and passes against this one.
          #
          # This route CAN satisfy it, and is the only one that can: it does
          # a second authorization AFTER loading the listing
          # (`store-listing.controller.ts:129-138`), because materiality
          # compares against the STORED S. YT-0576 removed the threshold, so
          # "material" now means "lowers S at all" -- which removes the
          # number, not the comparison, and therefore not the need to read.
          expr: "has(R.attr.isMaterialSettlementDecrease) && !R.attr.isMaterialSettlementDecrease"

    - name: merchandisers-request-a-settlement-decrease
      # YT-0575: the propose half of the workflow YT-0574 made mandatory.
      # Deliberately its own action, not folded into set_settlement_value --
      # the rule above denies that action outright for a material change, so
      # raising a request (which applies nothing) needed a different one.
      actions: ["request_settlement_decrease"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_editor_of

    - name: only-an-owner-or-admin-approves-the-cut
      actions: ["approve_settlement_decrease"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_team_editor_of

    - name: analysts-read-only
      actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_viewer_of

    - name: ops-approves-listings
      # docs/17 section 5: Ops owns merchant onboarding, KYB and listing approval.
      actions: ["view", "approve_listing", "reject_listing"]
      effect: EFFECT_ALLOW
      roles: ["ops"]
