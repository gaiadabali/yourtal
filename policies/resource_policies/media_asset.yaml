---
apiVersion: api.cerbos.dev/v1
description: |-
  Uploaded campaign media (TASKS.md 7.2): the raw file a business PUTs to
  MinIO and the HLS/poster/teaser/captions renditions the worker produces
  from it. Governed exactly like `campaign` itself -- an asset exists only
  to become a campaign's video, so it has no separate lifecycle a different
  role should own. `upload` covers both initiating and completing the
  multipart upload; there is no per-step split because both steps are the
  same person doing the same thing.
resourcePolicy:
  version: default
  resource: media_asset
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/media_asset.json
  rules:
    - name: editors-upload-and-view
      actions: ["upload", "view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_campaign_editor_of

    - name: analysts-view-only
      actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_campaign_viewer_of

    - name: f2-region-wall
      # 1.5.b: a business-side caller may never act on media owned by the
      # OTHER region's business, even if some rule above would otherwise
      # allow it. has(R.attr.region) makes this a no-op for a fresh upload
      # with no resource yet (idFrom defaults to the tenant, which carries
      # no region attribute of its own).
      actions: ["upload", "view"]
      effect: EFFECT_DENY
      roles: ["user", "business_user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
