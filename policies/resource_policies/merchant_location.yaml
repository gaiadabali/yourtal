---
apiVersion: api.cerbos.dev/v1
description: |-
  A business's own outlets (YT-0502, docs/17 section 2, Inventory zone).
  Same roles as `listing` -- a merchandiser manages branches the same way
  they manage listings, and an analyst reads them for the same reason.
resourcePolicy:
  version: default
  resource: merchant_location
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/merchant_location.json
  rules:
    - name: merchandisers-manage-locations
      actions: ["create", "edit", "archive"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_editor_of

    - name: analysts-read-only
      actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_viewer_of

    - name: f2-region-wall
      # 1.5.b: AU and ID are separate economies (F2) -- a consumer or
      # business-side caller may never act on a resource governed by the
      # OTHER region, even if some other rule above would otherwise allow
      # it. Scoped to user/business_user only: internal staff cross regions
      # by design (docs/17 section 5). has(R.attr.region) makes this a no-op
      # for an action with no resource yet (a create).
      actions: ["view", "create", "edit", "archive"]
      effect: EFFECT_DENY
      roles: ["user", "business_user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
