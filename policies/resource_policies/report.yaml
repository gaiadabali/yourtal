---
apiVersion: api.cerbos.dev/v1
description: |-
  Business reports (docs/17 section 2, Reports zone). All six office roles
  read reports; a counter device never does, and that is stated as a DENY
  because "never see reports" is a property of the device session, not an
  accident of which roles happen to be listed below.

  A report that resolves to an individual is not exportable by a business at
  all. Cohort floors are the product (YT-0217), and an export is the one
  operation that takes the data out of reach of any later control.
resourcePolicy:
  version: default
  resource: report
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/report.json
  rules:
    - name: counter-devices-never-see-reports
      actions: ["view", "export"]
      effect: EFFECT_DENY
      roles: ["store_device"]

    - name: no-business-exports-individuals
      actions: ["export"]
      effect: EFFECT_DENY
      roles: ["business_user"]
      condition:
        match:
          expr: has(R.attr.containsPii) && R.attr.containsPii

    - name: office-roles-read-reports
      actions: ["view", "export"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_report_viewer_of

    - name: internal-analysis
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["support", "risk_analyst", "finance", "ops"]

    - name: f2-region-wall
      # 1.5.b: AU and ID are separate economies (F2) -- a consumer or
      # business-side caller may never act on a resource governed by the
      # OTHER region, even if some other rule above would otherwise allow
      # it. Scoped to user/business_user only: internal staff (support,
      # moderator, finance, ops, risk_analyst, admin) cross regions by design
      # (docs/17 section 5), and store_device already names one business via
      # its own credential (1.5.c). has(R.attr.region) makes this a no-op
      # for an action with no resource yet (a create) or a kind whose
      # controller does not populate region yet.
      actions: ["view", "export"]
      effect: EFFECT_DENY
      roles: ["user", "business_user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
