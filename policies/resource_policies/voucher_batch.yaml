---
apiVersion: api.cerbos.dev/v1
description: |-
  Bulk voucher issuance (YT-0141), the second of the three two-person-approval
  actions in docs/17 section 2.1.

  A batch is vouchers that have not been earned -- the single largest way to
  put unfunded value into circulation by accident. So: a merchandiser or admin
  may REQUEST a batch, an owner or admin may APPROVE one, and the two may
  never be the same principal.
resourcePolicy:
  version: default
  resource: voucher_batch
  importDerivedRoles:
    - business
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/voucher_batch.json
  rules:
    - name: nobody-approves-their-own-batch
      actions: ["approve_issuance"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          expr: has(R.attr.requestedBy) && R.attr.requestedBy == P.id

    - name: request-a-batch
      actions: ["view", "request_issuance"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_inventory_editor_of

    - name: approve-a-batch
      actions: ["approve_issuance"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - business_team_editor_of

    - name: finance-voids
      # Voiding an issued batch is a value operation, so it belongs to internal
      # finance, not to the business that asked for it.
      actions: ["void"]
      effect: EFFECT_ALLOW
      roles: ["finance"]

    - name: f2-region-wall
      # 1.5.b: AU and ID are separate economies (F2) -- a consumer or
      # business-side caller may never act on a resource governed by the
      # OTHER region, even if some other rule above would otherwise allow
      # it. Scoped to user/business_user only: internal staff (support,
      # moderator, finance, ops, risk_analyst, admin) cross regions by design
      # (docs/17 section 5), and store_device already names one business via
      # its own credential (1.5.c). has(R.attr.region) makes this a no-op
      # for an action with no resource yet (a create) or a kind whose
      # controller does not populate region yet.
      actions: ["view", "request_issuance", "approve_issuance", "void"]
      effect: EFFECT_DENY
      roles: ["user", "business_user"]
      condition:
        match:
          expr: has(R.attr.region) && has(P.attr.jurisdiction) && P.attr.jurisdiction != R.attr.region
