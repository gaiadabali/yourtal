---
apiVersion: api.cerbos.dev/v1
description: |-
  TASKS.md 9.4.d, K13: the queue of vouchers a merchant would not honour that
  were already captured (checkout.dispute, outcome = 'queued', 4.7.c).
  Support opens cases (docs/17 section 5) and sees the queue; finance both
  sees it AND resolves one (TASKS.md 10.5.b), since resolving posts a real
  ledger recovery line (`recoverCapture`) -- the same "whoever can adjust
  cannot suspend, whoever suspends cannot adjust" separation user_account.yaml
  states, applied here as "whoever opens a case is not who moves money".
resourcePolicy:
  version: default
  resource: voucher_dispute
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///resource/voucher_dispute.json
  rules:
    - name: support-and-finance-see-the-queue
      actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["support", "finance"]

    - name: finance-resolves-a-dispute
      actions: ["resolve"]
      effect: EFFECT_ALLOW
      roles: ["finance"]
