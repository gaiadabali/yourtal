---
name: MediaAssetSuite
description: |-
  Uploaded campaign media (TASKS.md 7.2). Same editor set as `campaign`
  itself: owner, admin and marketer upload and view; analyst reads only;
  merchandiser and finance never touch it. The region wall is exercised
  generically by `region_wall_test.yaml`.
tests:
  - name: owner, admin and marketer upload and view; analyst views only
    input:
      principals: [budi_owner, citra_admin, dewi_marketer, gita_analyst]
      resources: [media_asset_kopi]
      actions: [upload, view]
    expected:
      - principal: budi_owner
        resource: media_asset_kopi
        actions: { upload: EFFECT_ALLOW, view: EFFECT_ALLOW }
      - principal: citra_admin
        resource: media_asset_kopi
        actions: { upload: EFFECT_ALLOW, view: EFFECT_ALLOW }
      - principal: dewi_marketer
        resource: media_asset_kopi
        actions: { upload: EFFECT_ALLOW, view: EFFECT_ALLOW }
      - principal: gita_analyst
        resource: media_asset_kopi
        actions: { upload: EFFECT_DENY, view: EFFECT_ALLOW }

  - name: a rival tenant is a stranger here
    input:
      principals: [rival_owner]
      resources: [media_asset_kopi]
      actions: [upload, view]
    expected:
      - principal: rival_owner
        resource: media_asset_kopi
        actions: { upload: EFFECT_DENY, view: EFFECT_DENY }
