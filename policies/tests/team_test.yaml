---
name: TeamSuite
description: |-
  docs/17 section 2.1: exactly one Owner, transferable only by the current
  Owner with re-authentication. The suite pins both halves -- the role can
  never be reached sideways through change_role, and the front door needs a
  step-up that is minutes old, not a session that logged in this morning.
options:
  now: "2026-09-19T10:00:00Z"
tests:
  - name: owner and admin run the team
    input:
      principals: [budi_owner, citra_admin, dewi_marketer, gita_analyst]
      resources: [team_kopi]
      actions: [view, invite, change_role, remove_member, provision_device, revoke_device]
    expected:
      - principal: budi_owner
        resource: team_kopi
        actions:
          view: EFFECT_ALLOW
          invite: EFFECT_ALLOW
          change_role: EFFECT_ALLOW
          remove_member: EFFECT_ALLOW
          provision_device: EFFECT_ALLOW
          revoke_device: EFFECT_ALLOW
      - principal: citra_admin
        resource: team_kopi
        actions:
          view: EFFECT_ALLOW
          invite: EFFECT_ALLOW
          change_role: EFFECT_ALLOW
          remove_member: EFFECT_ALLOW
          provision_device: EFFECT_ALLOW
          revoke_device: EFFECT_ALLOW
      - principal: dewi_marketer
        resource: team_kopi
        actions:
          view: EFFECT_DENY
          invite: EFFECT_DENY
          change_role: EFFECT_DENY
          remove_member: EFFECT_DENY
          provision_device: EFFECT_DENY
          revoke_device: EFFECT_DENY
      - principal: gita_analyst
        resource: team_kopi
        actions:
          view: EFFECT_DENY
          invite: EFFECT_DENY
          change_role: EFFECT_DENY
          remove_member: EFFECT_DENY
          provision_device: EFFECT_DENY
          revoke_device: EFFECT_DENY

  - name: ownership cannot be reached sideways
    input:
      principals: [budi_owner, citra_admin]
      resources: [team_kopi_targeting_owner]
      actions: [change_role, remove_member]
    expected:
      # Even the owner cannot promote someone to owner through change_role,
      # nor remove the owner. transfer_ownership is the only door.
      - principal: budi_owner
        resource: team_kopi_targeting_owner
        actions: { change_role: EFFECT_DENY, remove_member: EFFECT_DENY }
      - principal: citra_admin
        resource: team_kopi_targeting_owner
        actions: { change_role: EFFECT_DENY, remove_member: EFFECT_DENY }

  - name: YT-0580 -- demoting the real owner is denied, on the target's stored role
    description: |-
      `team_kopi_demoting_owner` carries the owner's REAL STORED role as
      `targetRole`, the shape a post-read authorization call supplies
      (`TeamMemberController.changeRole`), not the shape the route's own
      `@Authorize` sends (the caller's requested new role). Asserted for
      BOTH actions the `ownership-moves-only-by-transfer` rule covers, not
      only the one the bug was found in.
    input:
      principals: [budi_owner, citra_admin]
      resources: [team_kopi_demoting_owner]
      actions: [change_role, remove_member]
    expected:
      - principal: budi_owner
        resource: team_kopi_demoting_owner
        actions: { change_role: EFFECT_DENY, remove_member: EFFECT_DENY }
      - principal: citra_admin
        resource: team_kopi_demoting_owner
        actions: { change_role: EFFECT_DENY, remove_member: EFFECT_DENY }

  - name: YT-0580/YT-0581 -- an omitted targetRole cannot deny, on either action the rule covers
    description: |-
      `team_kopi_no_target_role` has no `targetRole` attribute at all --
      the shape of BOTH actions' FIRST, pre-read `@Authorize` call in
      `TeamMemberController` (`changeRole`'s decorator sends the caller's
      requested role, but that is a body field, not this fixture's shape;
      `remove`'s decorator sends no role at all, unconditionally, because a
      removal has no request-supplied role to check). `has(R.attr.
      targetRole)` is false either way, so `ownership-moves-only-by-transfer`
      cannot fire and the ALLOW from `owner-and-admin-run-the-team` stands.
      This is intentional and unchanged by YT-0581: it is the coarse
      capability gate common to both routes, not the ownership control.
      The ownership control -- for both actions -- is the SECOND, post-read
      `requireAction` call each route now makes once the target's real
      stored role is known, proved by `team_kopi_demoting_owner` above
      (`targetRole: "owner"`, both actions DENY) and, for `remove_member`
      specifically, by `team-member.routes.boot.test.ts` driving the real
      route end to end. Before YT-0581, `remove_member` had no second call
      at all, so this fixture's ALLOW was the ONLY thing the PDP ever said
      about a removal -- that gap is what closed, not this assertion.
    input:
      principals: [budi_owner, citra_admin]
      resources: [team_kopi_no_target_role]
      actions: [change_role, remove_member]
    expected:
      - principal: budi_owner
        resource: team_kopi_no_target_role
        actions: { change_role: EFFECT_ALLOW, remove_member: EFFECT_ALLOW }
      - principal: citra_admin
        resource: team_kopi_no_target_role
        actions: { change_role: EFFECT_ALLOW, remove_member: EFFECT_ALLOW }

  - name: transfer needs a fresh step-up, and only from the owner
    input:
      principals: [budi_owner, budi_owner_reauthed, citra_admin]
      resources: [team_kopi]
      actions: [transfer_ownership, delete_business]
    expected:
      # Same person, same role -- the only difference is a re-auth two
      # minutes ago. An ordinary session is not enough.
      - principal: budi_owner
        resource: team_kopi
        actions: { transfer_ownership: EFFECT_DENY, delete_business: EFFECT_ALLOW }
      - principal: budi_owner_reauthed
        resource: team_kopi
        actions: { transfer_ownership: EFFECT_ALLOW, delete_business: EFFECT_ALLOW }
      # Admin runs the team but does not own it.
      - principal: citra_admin
        resource: team_kopi
        actions: { transfer_ownership: EFFECT_DENY, delete_business: EFFECT_DENY }

  - name: a rival owner is a stranger here
    input:
      principals: [rival_owner]
      resources: [team_kopi]
      actions: [view, invite, change_role, transfer_ownership, delete_business]
    expected:
      - principal: rival_owner
        resource: team_kopi
        actions:
          view: EFFECT_DENY
          invite: EFFECT_DENY
          change_role: EFFECT_DENY
          transfer_ownership: EFFECT_DENY
          delete_business: EFFECT_DENY
