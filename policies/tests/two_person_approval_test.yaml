---
name: TwoPersonApprovalSuite
description: |-
  All three of the two-person-approval actions in docs/17 section 2.1, in one
  place: bulk voucher issuance, a material settlement-value decrease, and API
  credential rotation.

  The shared shape is "the approver is not the requester", and the reason it
  lives in the PDP rather than in each service is that three separate
  hand-written checks are three chances to forget one.
tests:
  - name: bulk issuance -- request and approval are different people
    input:
      principals: [eka_merchandiser, citra_admin, budi_owner]
      resources: [batch_kopi]
      actions: [request_issuance, approve_issuance]
    expected:
      # eka raised this batch, so eka cannot approve it
      - principal: eka_merchandiser
        resource: batch_kopi
        actions: { request_issuance: EFFECT_ALLOW, approve_issuance: EFFECT_DENY }
      - principal: citra_admin
        resource: batch_kopi
        actions: { request_issuance: EFFECT_ALLOW, approve_issuance: EFFECT_ALLOW }
      - principal: budi_owner
        resource: batch_kopi
        actions: { request_issuance: EFFECT_ALLOW, approve_issuance: EFFECT_ALLOW }

  - name: an admin cannot approve the batch they raised themselves
    input:
      principals: [citra_admin, budi_owner]
      resources: [batch_kopi_by_citra]
      actions: [approve_issuance]
    expected:
      - principal: citra_admin
        resource: batch_kopi_by_citra
        actions: { approve_issuance: EFFECT_DENY }
      - principal: budi_owner
        resource: batch_kopi_by_citra
        actions: { approve_issuance: EFFECT_ALLOW }

  - name: an ordinary listing edit needs no ceremony
    input:
      principals: [eka_merchandiser, gita_analyst]
      resources: [listing_kopi]
      actions: [view, edit, set_settlement_value]
    expected:
      - principal: eka_merchandiser
        resource: listing_kopi
        actions: { view: EFFECT_ALLOW, edit: EFFECT_ALLOW, set_settlement_value: EFFECT_ALLOW }
      - principal: gita_analyst
        resource: listing_kopi
        actions: { view: EFFECT_ALLOW, edit: EFFECT_DENY, set_settlement_value: EFFECT_DENY }

  - name: a material settlement cut is a request, not an edit
    input:
      principals: [eka_merchandiser, budi_owner]
      resources: [listing_kopi_cut]
      actions: [set_settlement_value, approve_settlement_decrease]
    expected:
      # The merchandiser who asked for the cut can neither apply it directly
      # nor approve it -- S is what we owe the merchant at redemption.
      - principal: eka_merchandiser
        resource: listing_kopi_cut
        actions: { set_settlement_value: EFFECT_DENY, approve_settlement_decrease: EFFECT_DENY }
      - principal: budi_owner
        resource: listing_kopi_cut
        actions: { set_settlement_value: EFFECT_DENY, approve_settlement_decrease: EFFECT_ALLOW }

  - name: >-
      YT-0574 -- an unstated materiality attribute must be refused, not
      allowed, because that is exactly what a real controller's synchronous
      `attrsFrom` produces (no DB read, so no fact about materiality yet).
      `!has(x) || !x` reads absence as "not material" and was fail-open; the
      fix requires positive evidence of `false` before the direct-apply path
      is granted. Every business role that could otherwise apply a listing
      edit is checked here, not just the merchandiser who raised YT-0574,
      because the bug was in the shared condition, not in a per-role rule.
    input:
      principals: [eka_merchandiser, citra_admin, budi_owner]
      resources: [listing_kopi_unstated]
      # create/edit/archive are asserted here too, and that is the point.
      # This case used to list set_settlement_value ALONE while its own
      # description said "the bug was in the shared condition" -- so the
      # condition was shared by four actions and the test checked one. The
      # positive-evidence fix then OVER-DENIED: with the attribute absent,
      # which is exactly what @Authorize alone produces, ordinary listing
      # edits were denied over HTTP -- and this suite stayed 390/390 green
      # both before and after the repair, because every other listing
      # fixture supplies the attribute by hand.
      #
      # A guardian that asserts only the action a bug was found in cannot
      # see the blast radius of its own fix.
      actions: [set_settlement_value, create, edit, archive]
    expected:
      - principal: eka_merchandiser
        resource: listing_kopi_unstated
        actions:
          {
            set_settlement_value: EFFECT_DENY,
            create: EFFECT_ALLOW,
            edit: EFFECT_ALLOW,
            archive: EFFECT_ALLOW,
          }
      - principal: citra_admin
        resource: listing_kopi_unstated
        actions:
          {
            set_settlement_value: EFFECT_DENY,
            create: EFFECT_ALLOW,
            edit: EFFECT_ALLOW,
            archive: EFFECT_ALLOW,
          }
      - principal: budi_owner
        resource: listing_kopi_unstated
        actions:
          {
            set_settlement_value: EFFECT_DENY,
            create: EFFECT_ALLOW,
            edit: EFFECT_ALLOW,
            archive: EFFECT_ALLOW,
          }

  - name: >-
      YT-0575 -- requesting a settlement decrease is its own action, separate
      from applying one (set_settlement_value, denied outright for a
      material change) and from approving one. Any inventory editor may
      raise a request; a marketer, who has no inventory role at all, may not.
    input:
      principals: [eka_merchandiser, dewi_marketer, budi_owner]
      resources: [listing_kopi]
      actions: [request_settlement_decrease]
    expected:
      - principal: eka_merchandiser
        resource: listing_kopi
        actions: { request_settlement_decrease: EFFECT_ALLOW }
      - principal: dewi_marketer
        resource: listing_kopi
        actions: { request_settlement_decrease: EFFECT_DENY }
      - principal: budi_owner
        resource: listing_kopi
        actions: { request_settlement_decrease: EFFECT_ALLOW }

  - name: credential rotation needs a second pair of hands
    input:
      principals: [citra_admin, budi_owner, eka_merchandiser]
      resources: [redemption_rotation_by_citra]
      actions: [rotate_credential, approve_credential_rotation]
    expected:
      - principal: citra_admin
        resource: redemption_rotation_by_citra
        actions: { rotate_credential: EFFECT_ALLOW, approve_credential_rotation: EFFECT_DENY }
      - principal: budi_owner
        resource: redemption_rotation_by_citra
        actions: { rotate_credential: EFFECT_ALLOW, approve_credential_rotation: EFFECT_ALLOW }
      - principal: eka_merchandiser
        resource: redemption_rotation_by_citra
        actions: { rotate_credential: EFFECT_DENY, approve_credential_rotation: EFFECT_DENY }

  - name: ops approves listings, the business does not approve its own
    input:
      principals: [ops_zul, budi_owner]
      resources: [listing_kopi]
      actions: [approve_listing, reject_listing]
    expected:
      - principal: ops_zul
        resource: listing_kopi
        actions: { approve_listing: EFFECT_ALLOW, reject_listing: EFFECT_ALLOW }
      - principal: budi_owner
        resource: listing_kopi
        actions: { approve_listing: EFFECT_DENY, reject_listing: EFFECT_DENY }
